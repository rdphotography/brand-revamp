<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Networks is becoming Complete IT</title>
    <style>
        /* --- RESET & LAYOUT --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0; /* Fallback color */
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* --- BACKGROUND LAYERS --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 'cover' ensures the image fills the screen without stretching distotion */
            background-size: cover; 
            /* 'top center' ensures the Logo/Header is always visible and centered */
            background-position: top center; 
            background-repeat: no-repeat;
            transition: all 4s ease-in-out; 
            will-change: opacity, filter; /* Optimizes performance for mobile */
        }

        /* --- DESKTOP IMAGES (Default) --- */
        .old-brand {
            background-image: url('old-desktop.png'); 
            z-index: 10;
            opacity: 1;
        }

        .new-brand {
            background-image: url('new-desktop.png'); 
            z-index: 5;
            opacity: 0;
        }

        /* --- MOBILE IMAGES (Triggered on screens smaller than 768px) --- */
        @media (max-width: 768px) {
            .old-brand {
                background-image: url('old-mobile.jpeg');
            }
            .new-brand {
                background-image: url('new-mobile.jpeg');
            }
        }

        /* --- OVERLAY MESSAGE --- */
        .overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            
            /* Glassmorphism / Frosted Glass Effect */
            background: rgba(0, 50, 80, 0.85); /* Slightly blue-tinted dark background */
            backdrop-filter: blur(5px); /* Blurs the background behind the box */
            color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            
            /* Hidden Initially */
            opacity: 0; 
            transition: opacity 1.5s ease;
        }

        .overlay-message h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* Mobile text adjustments */
        @media (max-width: 768px) {
            .overlay-message {
                padding: 25px;
                width: 85%;
            }
            .overlay-message h1 {
                font-size: 1.4rem;
            }
        }

        /* --- ANIMATION STATES --- */
        
        /* State 1: Show Text */
        .stage.start-sequence .overlay-message {
            opacity: 1;
        }

        /* State 2: Morph Backgrounds */
        .stage.morph .old-brand {
            filter: blur(20px); /* Heavy blur */
            opacity: 0;
        }

        .stage.morph .new-brand {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="stage" id="stage">
        <div class="new-brand bg-layer"></div>

        <div class="old-brand bg-layer"></div>

        <div class="overlay-message">
            <h1>Fluid Networks is becoming your<br>Complete IT provider!</h1>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const TOTAL_DURATION = 12000; // 12 Seconds total
        const REDIRECT_URL = "https://complete.net";

        window.addEventListener('load', () => {
            const stage = document.getElementById('stage');

            // 1. Reveal the message after 0.5 seconds
            setTimeout(() => {
                stage.classList.add('start-sequence');
            }, 500);

            // 2. Start the Blur/Fade transition after 2.5 seconds
            setTimeout(() => {
                stage.classList.add('morph');
            }, 2500);

            // 3. Redirect when finished
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, TOTAL_DURATION);
        });
    </script>
</body>
</html>
